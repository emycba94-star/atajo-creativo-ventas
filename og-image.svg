<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c6f135;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#c6f135;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Green accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="#c6f135"/>
  <!-- Subtle glow -->
  <rect x="0" y="0" width="600" height="630" fill="url(#glow)"/>
  <!-- Grid dots subtle -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#c6f135" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Brand tag -->
  <text x="80" y="120" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#c6f135" letter-spacing="4" text-transform="uppercase">ATAJO CREATIVO</text>
  <!-- Main headline -->
  <text x="80" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">TU SISTEMA</text>
  <text x="80" y="295" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">DE VENTAS</text>
  <text x="80" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="900" fill="#c6f135" letter-spacing="-2">POR WHATSAPP</text>
  <!-- Subtext -->
  <text x="80" y="450" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#888888">IA personalizada · 10 m&#xF3;dulos · En menos de 2 minutos</text>
  <!-- CTA pill -->
  <rect x="80" y="490" width="280" height="52" rx="8" fill="#c6f135"/>
  <text x="220" y="522" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="1">EMPEZAR GRATIS &#x2192;</text>
  <!-- Stats right side -->
  <text x="850" y="220" font-family="system-ui,-apple-system,sans-serif" font-size="80" font-weight="900" fill="#c6f135" text-anchor="middle">+2.400</text>
  <text x="850" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">SISTEMAS GENERADOS</text>
  <text x="850" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">6</text>
  <text x="850" y="405" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">RUBROS DISPONIBLES</text>
  <text x="850" y="495" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">10</text>
  <text x="850" y="540" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">M&#xD3;DULOS DE VENTA</text>
  <!-- Divider -->
  <line x1="700" y1="160" x2="700" y2="570" stroke="#222" stroke-width="1"/>
  <!-- Bottom border -->
  <rect x="0" y="620" width="1200" height="10" fill="#c6f135" opacity="0.3"/>
  <!-- URL -->
  <text x="600" y="608" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#444444" text-anchor="middle">cozy-baklava-5e60cd.netlify.app</text>
